# SonarQube scan: `sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.token=$SONARQUBE_TOKEN`
sonar.projectKey=makebetter-pizza
sonar.projectName=Make Better Pizza
sonar.sources=src,index.html,public
sonar.tests=src
sonar.test.inclusions=src/**/*.check.ts
sonar.exclusions=**/node_modules/**,dist/**,design-concepts/**,public/**/*.png,public/**/*.jpg,public/**/*.webp
sonar.sourceEncoding=UTF-8
# The string table is one key with an English and a Turkish line, 240 times: not copy-paste.
sonar.cpd.exclusions=src/context/translations.ts
