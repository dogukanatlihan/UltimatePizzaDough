<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il Menù · Make Better Pizza</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Oswald:wght@500;600;700&display=swap">
<style>
:root{--board:#154536;--deep:#103b2e;--cream:#fff8e8;--gold:#ffd15a;--muted:#ccd7ca;--rule:#678476;--paper:white;--ink:#202722;--gray:#59625b;--line:#c6ccc6;--display:Oswald,Impact,'Arial Narrow',sans-serif;--body:'DM Sans',Arial,sans-serif;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box}body{margin:0;color:var(--cream);background:var(--board);font:16px var(--body);font-variant-numeric:tabular-nums}header,main{max-width:1250px;margin:auto;padding-inline:clamp(16px,4vw,60px)}header{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule)}header strong{font:600 23px var(--display);text-transform:uppercase}header strong i{color:var(--gold);margin-right:8px}small,.kicker,.time,output{font:500 12px var(--mono)}.kicker{text-transform:uppercase;letter-spacing:.15em}main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(325px,1fr);gap:clamp(32px,6vw,88px);align-items:start;padding-block:32px 70px}h1,h2,h3,p{margin:0}h1,h2,.name,.ticketTitle{font-family:var(--display);text-transform:uppercase}h1{font-size:clamp(68px,8vw,106px);letter-spacing:-.05em;line-height:1.15}.intro{display:flex;align-items:end;justify-content:space-between;margin-bottom:18px}.intro small{padding-bottom:9px;color:var(--gold)}button,input,select,summary{font:inherit;accent-color:var(--gold)}button,summary,select{cursor:pointer}button{color:inherit;background:transparent;border:0}button:hover,summary:hover{background:color-mix(in srgb,currentColor 8%,transparent)}button:active{opacity:.8}:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}.row{width:100%;display:flex;align-items:center;text-align:left;gap:15px;padding:13px 12px;border-block-end:1px solid var(--rule);transition:background .18s}.row:first-child{border-top:1px solid var(--rule)}.row[aria-pressed=true]{background:var(--deep);box-shadow:inset 4px 0 var(--gold)}.row img{width:51px;height:51px;border-radius:50%;object-fit:cover}.copy{flex:1;min-width:0}.top,.pair{display:flex;align-items:baseline;gap:8px}.dots{flex:1;border-bottom:2px dotted currentColor;opacity:.38}.name{font-size:27px;font-weight:600;line-height:1.15}.row[aria-pressed=true] .name{color:var(--gold)}.blurb{display:block;color:var(--muted);font-size:14px;margin-top:4px}.order{margin:28px 0 18px;font-size:32px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:grid;gap:6px;align-content:start}.field>span{display:flex;align-items:center;justify-content:space-between;gap:4px}.field input,.field select{min-width:0;width:100%;height:44px}.field input:not([type=range]),select{border:1px solid var(--rule);border-radius:3px;background:var(--deep);color:var(--cream);padding:0 12px}input[type=range]{margin:0}summary{padding:16px 0;border-top:1px solid var(--rule);font-weight:bold}details{margin-top:16px}aside{position:sticky;top:16px;background:var(--paper);color:var(--ink);min-width:0}aside:after{content:'';position:absolute;top:100%;height:8px;width:100%;background:linear-gradient(135deg,var(--paper) 25%,transparent 25%) -6px 0/12px 12px,linear-gradient(225deg,var(--paper) 25%,transparent 25%) -6px 0/12px 12px}.slip{padding:25px clamp(18px,2.6vw,34px);max-height:calc(100dvh - 50px);overflow:auto}.stamp{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:12px}.ticketTitle{font-size:34px;margin:14px 0 3px}.meta{color:var(--gray);font:13px var(--mono)}.ingredients{margin-top:18px;border-top:1px dashed var(--line);padding-top:8px}.pair{padding:5px 0;font:14px var(--mono)}.pair small{color:var(--gray);font-size:11px}.weight{text-align:right}.weight small{display:block}.total{display:flex;justify-content:space-between;align-items:center;border-block:2px solid var(--ink);padding:10px 0;margin:10px 0 16px;font-weight:bold}.total b{font:600 27px var(--display)}.switch{display:flex;border:1px solid var(--ink)}.switch button{flex:1;min-height:44px}.switch [aria-pressed=true],#copyBtn{background:var(--ink);color:var(--paper)}.instructions{font-size:14px;line-height:1.55}.instructions h3{font-size:16px;margin:15px 0 4px}.instructions ol{padding-left:22px}.instructions li{padding-left:3px;margin:6px 0}#copyBtn{width:100%;min-height:44px;font-weight:bold}#handle{display:none}.field.full{grid-column:1/-1}.field>span{font-weight:500}.stepper{display:grid;grid-template-columns:54px minmax(0,1fr) 54px;border:1px solid var(--rule);border-radius:3px;background:var(--deep)}.stepper button{height:54px;font:500 24px var(--mono)}.stepper output{display:grid;place-items:center;font:600 25px var(--display);letter-spacing:.02em;white-space:nowrap}.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{flex:1 1 auto;min-height:46px;padding:0 12px;border:1px solid var(--rule);border-radius:3px;font-size:14px;font-weight:500;transition:background .15s,color .15s}.seg button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--deep);font-weight:700}summary{min-height:52px;display:flex;align-items:center}.warn{font-weight:bold;border:2px solid;padding:8px}
@media(max-width:959px){main{display:block;padding-block:22px 110px}.row{gap:10px;padding:12px 8px}.row img{width:42px;height:42px}.name{font-size:24px}.time{font-size:11px}.intro{margin-bottom:10px}header{height:58px}aside{position:fixed;z-index:3;inset:auto 0 0;border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}#handle{touch-action:none;display:flex;align-items:center;justify-content:space-between;width:100%;height:58px;padding:0 10px;font:500 clamp(10px,2.7vw,14px) var(--mono)}#handle:before{content:'';position:absolute;top:4px;left:calc(50% - 16px);width:32px;height:3px;background:var(--line)}.slip{max-height:0;padding-block:0;visibility:hidden;transition:max-height .2s,visibility .2s}.open .slip{visibility:visible;max-height:70dvh;padding-block:16px}.fields{gap:14px}.blurb{font-size:13px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><strong><i aria-hidden="true">✳</i>Make Better Pizza</strong><small>Dough calculator</small></header>
<main><section><div class="intro"><h1>Il Menù</h1><small>SELECT A STYLE ↓</small></div><div id="menu"></div><h2 class="order">Your order</h2><div id="basic" class="fields"></div><details><summary>Kitchen notes</summary><div id="notes" class="fields"></div></details></section>
<aside id="ticket"><button id="handle" aria-expanded="false" aria-controls="slip"></button><div class="slip" id="slip"><div class="stamp"><h2 class="kicker">Order ticket</h2><small id="serial"></small></div><div id="recipe"></div><div class="switch"><button data-tab="Method">Method</button><button data-tab="Bake">Bake</button></div><div class="instructions" id="steps"></div><button id="copyBtn">Copy recipe</button><small role="status" id="status"></small></div></aside></main>
<script src="calc.js"></script><script>
const D=Dough,$=id=>document.getElementById(id);
let st=D.defaults('neapolitan'),rec,tab='Method';
$('menu').innerHTML=D.STYLES.map(s=>`<button class="row" data-style="${s.id}"><img src="${s.img}" alt=""><span class="copy"><span class="top"><span class="name">${s.name}</span><span class="dots"></span><span class="time">${s.bakeTime}</span></span><span class="blurb">${s.blurb}</span></span></button>`).join('');
function field(k,label,type='range'){
 const len=['d','w','l'].includes(k),v=len?D.toDisp(st[k],st.units):k==='prefPct'?st.pref.pct:k==='prefHyd'?st.pref.hyd:st[k];
 let [min,max,step]=D.RANGES[k==='yeast'&&st.yeastType==='fresh'?'yeastFresh':k];
 if(len){min=D.toDisp(min,st.units);max=D.toDisp(max,st.units);if(st.units==='in')step=.1}
 if(type==='number')return `<div class="field"><span id="l-${k}">${label}</span><div class="stepper" role="group" aria-labelledby="l-${k}"><button type="button" data-nudge="${k}" data-dir="-1" aria-label="Less">−</button><output>${k==='pizzas'?st.pizzas:D.fmtLen(st[k],st.units)}</output><button type="button" data-nudge="${k}" data-dir="1" aria-label="More">+</button></div></div>`;
 return `<label class="field full"><span>${label}<output id="o-${k}"></output></span><input type="range" aria-label="${label}" data-key="${k}" min="${min}" max="${max}" step="${step}" value="${v}"></label>`;
}
function choice(k,label,opts,value){return `<div class="field full"><span id="l-${k}">${label}</span><div class="seg" role="group" aria-labelledby="l-${k}">${Object.entries(opts).map(([v,n])=>`<button type="button" data-choice="${k}" data-value="${v}" aria-pressed="${value===v}">${n.replace(' yeast','')}</button>`).join('')}</div></div>`}
function controls(){
 $('basic').innerHTML=field('pizzas','How many?','number')+(st.shape==='round'?field('d','How wide?','number'):field('w','Pan width','number')+field('l','Pan length','number'))+(D.style(st.style).shape==='both'?choice('shape','Shape',{rect:'Rectangular pan',round:'Round'},st.shape):'')+field('tf','Thin → thick')+field('hydration','Hydration (water)')+choice('units','Measure in',{cm:'Centimetres',in:'Inches'},st.units);
 $('notes').innerHTML=choice('yeastType','Yeast type',D.YEAST_NAMES,st.yeastType)+Object.entries({salt:'Salt',yeast:'Yeast',oil:'Olive oil',sugar:'Sugar',malt:'Diastatic malt',enhancer:'Dough enhancer'}).map(([k,n])=>field(k,n)).join('')+choice('pref','Preferment',D.PREF_NAMES,st.pref.type)+(st.pref.type==='none'?'':field('prefPct','Prefermented flour')+field('prefHyd','Starter hydration'));
}
const list=steps=>'<ol>'+steps.map(s=>'<li>'+s+'</li>').join('')+'</ol>';
function directions(){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===tab));const b=D.bake(st);$('steps').innerHTML=tab==='Method'?D.method(st,rec).map(m=>`<h3>${m.title}</h3><small>${m.time}</small>${list(m.steps)}`).join(''):`<h3>${b.temp} · ${b.time}</h3><p>${b.flour}</p>${list(b.steps)}`;}
function rows(items){return items.map(i=>`<div class="pair"><span>${i.name} ${i.pct===undefined?'':'<small>'+i.pct+'%</small>'}</span><span class="dots"></span><span class="weight">${D.fmtG(i.g,i.key)}<small>${D.fmtOz(i.g)}</small></span></div>`).join('')}
function render(){
 rec=D.calc(st);const name=D.style(st.style).name;
 document.querySelectorAll('[data-style]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.style===st.style));
 document.querySelectorAll('input[type=range]').forEach(e=>{$('o-'+e.dataset.key).textContent=e.dataset.key==='tf'?rec.ballWeight+' g / ball':e.value+'%'});
 $('serial').textContent='Nº '+rec.ballWeight+'–'+String(st.pizzas).padStart(2,'0');
 $('recipe').innerHTML=`<h3 class="ticketTitle">${name}</h3><p class="meta">${st.pizzas} × ${rec.ballWeight} g · ${D.sizeLabel(st)}</p><div class="ingredients">${rows(rec.ingredients)}</div><div class="total">Total dough <b>${rec.totalDough} g</b></div>`+(rec.stages?`<h3>${rec.stages.name}</h3>${rows(rec.stages.first)}<h3>Main dough</h3>${rows(rec.stages.main)}`:'')+(rec.warnWater?'<p class="warn">Preferment water exceeds total water. Reduce the prefermented flour or starter hydration.</p>':'');
 $('handle').innerHTML=`<b>${name}</b><span>${st.pizzas}×${rec.ballWeight}g</span><span>${rec.totalDough}g total</span><span>${Math.round(rec.flour)}g flour</span><b aria-hidden="true">${$('ticket').classList.contains('open')?'⌄':'⌃'}</b>`;
 $('status').textContent='';directions();
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.style){st=D.setStyle(st,b.dataset.style);controls();render()}if(b.dataset.tab){tab=b.dataset.tab;directions()}
 if(b.dataset.nudge){const k=b.dataset.nudge,dir=+b.dataset.dir,[min,max]=D.RANGES[k];st={...st,[k]:k==='pizzas'?Math.min(max,Math.max(min,st.pizzas+dir)):Math.min(max,Math.max(min,D.fromDisp(Math.round(D.toDisp(st[k],st.units))+dir,st.units)))};controls();render();document.querySelector(`[data-nudge="${k}"][data-dir="${dir}"]`).focus({preventScroll:true})}
 if(b.dataset.choice){const k=b.dataset.choice,v=b.dataset.value;st=k==='pref'?D.setPreferment(st,v):k==='yeastType'?D.setYeastType(st,v):{...st,[k]:v};controls();render();document.querySelector(`[data-choice="${k}"][data-value="${v}"]`).focus({preventScroll:true})}});
document.addEventListener('input',e=>{const el=e.target,k=el.dataset.key;if(!k)return;let v=el.value;
 if(el.tagName==='SELECT'){st=k==='pref'?D.setPreferment(st,v):k==='yeastType'?D.setYeastType(st,v):{...st,[k]:v};controls();document.querySelector('[data-key="'+k+'"]').focus({preventScroll:true})}
 else{if(!el.validity.valid||v==='')return;v=Number(v);if(['d','w','l'].includes(k))v=Math.max(D.RANGES[k][0],Math.min(D.RANGES[k][1],D.fromDisp(v,st.units)));st=k==='prefPct'||k==='prefHyd'?{...st,pref:{...st.pref,[k==='prefPct'?'pct':'hyd']:v}}:{...st,[k]:v}}
 render();
});
document.addEventListener('focusout',e=>{const el=e.target;if(el.type==='number'&&(!el.validity.valid||el.value===''))el.value=el.dataset.key==='pizzas'?st.pizzas:D.toDisp(st[el.dataset.key],st.units)});
function drawer(open){$('ticket').classList.toggle('open',open);$('handle').setAttribute('aria-expanded',open);render()}
let start,drag=false;const h=$('handle');h.onpointerdown=e=>{start=e.clientY;drag=false;h.setPointerCapture(e.pointerId)};h.onpointerup=e=>{if(Math.abs(e.clientY-start)>24){drag=true;drawer(e.clientY<start)}};h.onclick=e=>{if(!drag||!e.detail)drawer(!$('ticket').classList.contains('open'));drag=false};
$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(D.copyText(st,rec));$('status').textContent='Copied'}catch{$('status').textContent='Clipboard unavailable. Select the recipe text to copy.'}};
controls();render();
</script></body></html>
