<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tre Passi — concept 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: three steps. Phone shows one step per screen with a fixed bottom bar; wide screens show all three as columns. */
:root {
  --basil: #1C5A3A; --basil-deep: #113D27; --basil-tint: #E3EEE4;
  --ground: #F1F5EE;      /* mozzarella-white with a green cast */
  --card: #FFFFFF; --ink: #13241A; --ink-2: #55675B; --line: #D5E0D3;
  --tomato: #D43D2B;      /* primary action only */
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 20px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/1.5 var(--body); padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--tomato); outline-offset: 2px; }
h2, h3, p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }

/* Header: tricolore hairline, brand, step tabs */
.flag { height: 5px; background: linear-gradient(90deg, var(--basil) 0 33.33%, #fff 33.33% 66.66%, var(--tomato) 66.66%); }
.bar { position: sticky; top: 0; z-index: 10; background: var(--basil); color: #fff; }
.barin { max-width: 1320px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font: 800 19px/1 var(--display); letter-spacing: -.01em; white-space: nowrap; }
.tabs { display: flex; gap: 6px; }
.tab { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px 0 6px; border: 0; border-radius: 999px; background: transparent; color: #CFE2D3; font-weight: 600; font-size: 14px; transition: background .18s, color .18s; }
.tab i { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid currentColor; font: 700 14px/1 var(--display); font-style: normal; }
.tab[aria-current="step"] { background: #fff; color: var(--basil-deep); }
.tab[aria-current="step"] i { background: var(--basil); border-color: var(--basil); color: #fff; }
@media (max-width: 559px) { .barin { flex-wrap: wrap; row-gap: 8px; } .tabs { width: 100%; } .tab { flex: 1; justify-content: center; padding: 0 8px 0 4px; background: rgba(255,255,255,.1); } }

.steps { max-width: 1320px; margin: 0 auto; padding: 22px 16px 0; }
.step > header { margin-bottom: 16px; }
.kicker { font: 700 13px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--basil); }
.step h2 { margin-top: 6px; font: 800 clamp(28px, 7vw, 38px)/1.05 var(--display); letter-spacing: -.02em; text-wrap: balance; }
.step h2:focus { outline: none; }
.step h2 + p { margin-top: 8px; color: var(--ink-2); max-width: 46ch; }

/* Step 1: style cards */
.pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sty { position: relative; display: block; padding: 0; text-align: left; border: 2px solid transparent; border-radius: var(--r); background: var(--card); overflow: hidden; box-shadow: 0 1px 2px rgba(19,36,26,.08); transition: transform .15s, border-color .15s, box-shadow .15s; }
.sty:hover { transform: translateY(-2px); box-shadow: 0 10px 24px -12px rgba(19,36,26,.35); }
.sty img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.sty .t { display: block; padding: 10px 12px 12px; }
.sty b { display: block; font: 700 18px/1.15 var(--display); letter-spacing: -.01em; }
.sty small { display: block; margin-top: 3px; font-size: 13px; line-height: 1.3; color: var(--ink-2); }
.sty[aria-pressed="true"] { border-color: var(--basil); }
.sty[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 10px; right: 10px; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--basil); color: #fff; font-weight: 700; }

/* Shared control blocks */
.block { background: var(--card); border-radius: var(--r); padding: 18px; box-shadow: 0 1px 2px rgba(19,36,26,.08); }
.block + .block { margin-top: 12px; }
.lab { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-weight: 600; }
.lab small { font-weight: 500; color: var(--ink-2); }
.count { display: grid; grid-template-columns: 56px minmax(0, 1fr) 56px; align-items: center; margin-top: 10px; background: var(--ground); border-radius: 16px; padding: 4px; }
.count button { height: 52px; border: 0; border-radius: 13px; background: var(--card); font: 700 24px/1 var(--display); box-shadow: 0 1px 2px rgba(19,36,26,.12); transition: background .12s, transform .12s; }
.count button:hover { background: var(--basil-tint); } .count button:active { transform: scale(.95); }
.count output { text-align: center; font: 800 30px/1 var(--display); letter-spacing: -.02em; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.seg button { flex: 1 1 auto; min-height: 46px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 13px; background: var(--card); font-weight: 600; font-size: 15px; transition: background .15s, border-color .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--basil); border-color: var(--basil); color: #fff; }
.sl { margin-top: 6px; }
.sl output { font: 800 24px/1 var(--display); letter-spacing: -.01em; }
.ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); }
.say { margin-top: 6px; font-size: 14px; color: var(--ink-2); }
input[type=range] { width: 100%; height: 44px; margin: 0; background: transparent; appearance: none; -webkit-appearance: none; }
input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 10px; background: linear-gradient(to right, var(--basil) var(--p, 0%), var(--line) var(--p, 0%)); }
input[type=range]::-moz-range-track { height: 10px; border-radius: 10px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 10px; border-radius: 10px; background: var(--basil); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -10px; border-radius: 50%; background: #fff; border: 3px solid var(--basil); box-shadow: 0 2px 8px rgba(19,36,26,.25); }
input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 3px solid var(--basil); }

/* Step 3: recipe */
.recipe { background: var(--card); border-radius: var(--r); overflow: hidden; box-shadow: 0 1px 2px rgba(19,36,26,.08); }
.rhead { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--basil-deep); color: #fff; }
.rhead img { width: 60px; height: 60px; border-radius: 14px; object-fit: cover; flex: none; }
.rhead b { display: block; font: 800 22px/1.1 var(--display); letter-spacing: -.01em; }
.rhead span { font-size: 14px; color: #CFE2D3; }
.ing { display: grid; grid-template-columns: minmax(0, 1fr) auto 62px; align-items: center; gap: 10px; min-height: 54px; padding: 6px 16px; border-bottom: 1px solid var(--line); }
.ing .g { text-align: right; font: 700 20px/1 var(--display); white-space: nowrap; }
.ing .g small { display: block; margin-top: 4px; font: 500 12px/1 var(--body); color: var(--ink-2); }
.ing .pc { justify-self: end; padding: 4px 8px; border-radius: 8px; background: var(--basil-tint); color: var(--basil-deep); font-size: 13px; font-weight: 700; }
.ing.sum { background: var(--ground); border-bottom: 0; font-weight: 700; }
.stagehd { padding: 14px 16px 6px; font: 700 13px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--basil); }
.warn { margin: 12px 16px; padding: 12px 14px; border-radius: 12px; background: #FDECE9; color: #8A2114; font-size: 14px; font-weight: 500; }
details { background: var(--card); border-radius: var(--r); box-shadow: 0 1px 2px rgba(19,36,26,.08); margin-top: 12px; }
summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; padding: 0 18px; font-weight: 700; cursor: pointer; list-style: none; border-radius: var(--r); }
summary::-webkit-details-marker { display: none; }
summary small { display: block; font-weight: 500; font-size: 13px; color: var(--ink-2); }
summary::after { content: "+"; display: grid; place-items: center; flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--ground); font: 700 20px/1 var(--display); transition: transform .2s; }
details[open] summary::after { transform: rotate(45deg); }
.inside { padding: 0 18px 18px; display: grid; gap: 18px; }
.how h3 { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-top: 4px; font: 700 17px/1.2 var(--display); }
.how h3 span { font: 600 13px/1 var(--body); color: var(--basil); white-space: nowrap; }
.how ol { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.how li::marker { font-weight: 700; color: var(--basil); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.facts div { padding: 12px; border-radius: 14px; background: var(--ground); }
.facts small { display: block; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.facts b { font: 700 17px/1.2 var(--display); }

/* Bottom bar (phone) */
.nav { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: rgba(255,255,255,.94); backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
.back { width: 52px; height: 52px; border: 1.5px solid var(--line); border-radius: 16px; background: var(--card); font-size: 20px; }
.back[hidden] + .sumline { grid-column: 1 / 3; }
.sumline { min-width: 0; }
.sumline b { display: block; font: 800 18px/1.15 var(--display); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sumline span { display: block; font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.go { min-height: 52px; padding: 0 22px; border: 0; border-radius: 16px; background: var(--tomato); color: #fff; font: 700 16px/1 var(--display); white-space: nowrap; transition: transform .12s, filter .15s; }
.go:hover { filter: brightness(1.07); } .go:active { transform: scale(.97); }

@media (max-width: 1039px) {
  .step { display: none; animation: in .25s ease; }
  body[data-step="1"] #s1, body[data-step="2"] #s2, body[data-step="3"] #s3 { display: block; }
  @keyframes in { from { opacity: 0; transform: translateX(14px); } }
  .steps { max-width: 640px; }
}
@media (min-width: 1040px) {
  body { padding-bottom: 40px; }
  .steps { display: grid; grid-template-columns: 300px 340px minmax(0, 1fr); gap: 28px; align-items: start; padding-top: 30px; }
  .step h2 { font-size: 26px; }
  .pick { grid-template-columns: 1fr; gap: 8px; }
  .sty { display: grid; grid-template-columns: 76px minmax(0, 1fr); align-items: center; border-radius: 16px; }
  .sty img { width: 76px; height: 76px; aspect-ratio: auto; }
  .sty[aria-pressed="true"]::after { top: 50%; margin-top: -15px; }
  .nav { display: none; }
  .tab { pointer-events: none; background: transparent !important; color: #CFE2D3 !important; }
  .tab i { background: transparent !important; border-color: currentColor !important; color: inherit !important; }
  .tab span { display: inline; }
  #copywide { display: inline-flex; }
}
#copywide { display: none; align-items: center; margin: 14px 16px 16px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body data-step="1">
<div class="flag" aria-hidden="true"></div>
<div class="bar">
  <div class="barin">
    <div class="brand">Make Better Pizza</div>
    <nav class="tabs" aria-label="Steps">
      <button class="tab" type="button" data-go="1" aria-current="step"><i>1</i><span>Style</span></button>
      <button class="tab" type="button" data-go="2"><i>2</i><span>Size</span></button>
      <button class="tab" type="button" data-go="3"><i>3</i><span>Recipe</span></button>
    </nav>
  </div>
</div>

<main class="steps">
  <section class="step" id="s1" aria-labelledby="h1">
    <header><p class="kicker">Step 1 of 3</p><h2 id="h1" tabindex="-1">Which pizza are you making?</h2></header>
    <div class="pick" id="pick"></div>
  </section>

  <section class="step" id="s2" aria-labelledby="h2">
    <header><p class="kicker">Step 2 of 3</p><h2 id="h2" tabindex="-1">How many, and how big?</h2></header>
    <div id="sizing"></div>
  </section>

  <section class="step" id="s3" aria-labelledby="h3">
    <header><p class="kicker">Step 3 of 3</p><h2 id="h3" tabindex="-1">Your recipe</h2></header>
    <div class="recipe" id="recipe"></div>
    <div id="tune"></div>
    <details id="d-how" open><summary><span>Method<small id="howsub"></small></span></summary><div class="inside how" id="how"></div></details>
    <details id="d-bake"><summary><span>Baking<small id="bakesub"></small></span></summary><div class="inside how" id="bake"></div></details>
  </section>
</main>

<div class="nav">
  <button class="back" type="button" id="back" aria-label="Back" hidden>←</button>
  <div class="sumline" aria-live="polite"><b id="sum1"></b><span id="sum2"></span></div>
  <button class="go" type="button" id="go"></button>
</div>

<script src="calc.js"></script>
<script>
const D = Dough, $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
let st = D.defaults('neapolitan'), rec, step = 1;
const wide = () => matchMedia('(min-width: 1040px)').matches;
const feel = (h) => h < 60 ? 'Firm and easy to shape.' : h <= 68 ? 'Classic and balanced.' : h <= 75 ? 'Soft and airy, a little sticky.' : 'Very wet. Best baked in a pan.';
const crust = (tf) => tf <= 0.06 ? 'Thin' : tf <= 0.09 ? 'Medium' : tf <= 0.12 ? 'Thick' : 'Extra thick';
const pc = (v) => +(+v).toFixed(2) + '%';
const F = {
  tf:        { label: 'Crust', get: () => st.tf, set: (v) => st = { ...st, tf: v }, range: () => D.RANGES.tf, text: crust, ends: ['Thin', 'Thick'], say: () => `Each dough ball: ${D.ballWeight(st)} g` },
  hydration: { label: 'Water in the dough', get: () => st.hydration, set: (v) => st = { ...st, hydration: v }, range: () => D.RANGES.hydration, text: pc, ends: ['Firmer', 'Wetter'], say: () => feel(st.hydration) },
  salt:      { label: 'Salt', get: () => st.salt, set: (v) => st = { ...st, salt: v }, range: () => D.RANGES.salt, text: pc },
  yeast:     { label: 'Yeast', get: () => st.yeast, set: (v) => st = { ...st, yeast: v }, range: () => st.yeastType === 'fresh' ? D.RANGES.yeastFresh : D.RANGES.yeast, text: (v) => (+v).toFixed(2) + '%', say: () => 'Less yeast: slower rise, more flavour.' },
  oil:       { label: 'Olive oil', get: () => st.oil, set: (v) => st = { ...st, oil: v }, range: () => D.RANGES.oil, text: pc },
  sugar:     { label: 'Sugar', get: () => st.sugar, set: (v) => st = { ...st, sugar: v }, range: () => D.RANGES.sugar, text: pc },
  malt:      { label: 'Diastatic malt', get: () => st.malt, set: (v) => st = { ...st, malt: v }, range: () => D.RANGES.malt, text: pc },
  enhancer:  { label: 'Dough enhancer', get: () => st.enhancer, set: (v) => st = { ...st, enhancer: v }, range: () => D.RANGES.enhancer, text: pc },
  prefPct:   { label: 'Share of the flour', get: () => st.pref.pct, set: (v) => st = { ...st, pref: { ...st.pref, pct: v } }, range: () => D.RANGES.prefPct, text: pc },
  prefHyd:   { label: 'Water in the preferment', get: () => st.pref.hyd, set: (v) => st = { ...st, pref: { ...st.pref, hyd: v } }, range: () => D.RANGES.prefHyd, text: pc, say: () => 'Poolish about 100%, biga 50–60%, sponge 65–80%.' },
};
const slider = (k) => { const f = F[k], [min, max, s] = f.range(), v = f.get();
  return `<div class="sl"><div class="lab"><label for="r-${k}">${f.label}</label><output id="o-${k}" for="r-${k}" class="num">${f.text(v)}</output></div>
    <input type="range" id="r-${k}" data-k="${k}" min="${min}" max="${max}" step="${s}" value="${v}" style="--p:${(v - min) / (max - min) * 100}%">
    ${f.ends ? `<div class="ends"><span>${f.ends[0]}</span><span>${f.ends[1]}</span></div>` : ''}${f.say ? `<p class="say" id="y-${k}">${f.say()}</p>` : ''}</div>`; };
const counter = (k, label, text) => `<div><div class="lab"><span id="cl-${k}">${label}</span></div><div class="count" role="group" aria-labelledby="cl-${k}">
  <button type="button" data-nudge="${k}" data-dir="-1" aria-label="Less">−</button><output id="c-${k}" class="num">${text}</output><button type="button" data-nudge="${k}" data-dir="1" aria-label="More">+</button></div></div>`;
const seg = (label, attr, opts, cur) => `<div><div class="lab"><span id="sg-${attr}">${label}</span></div><div class="seg" role="group" aria-labelledby="sg-${attr}">${opts.map(([v, t]) => `<button type="button" data-${attr}="${v}" aria-pressed="${v === cur}">${t}</button>`).join('')}</div></div>`;
const LEN = { d: 'Diameter', w: 'Pan width', l: 'Pan length' };

/* build(): controls. Called when the SET of controls changes (style, shape, units, yeast type, preferment type). */
function build() {
  const keep = Object.fromEntries($$('#tune details').map((d) => [d.id, d.open]));
  $('#pick').innerHTML = D.STYLES.map((s) => `<button type="button" class="sty" data-style="${s.id}" aria-pressed="${s.id === st.style}"><img src="${s.img}" alt="" loading="lazy"><span class="t"><b>${s.name}</b><small>${s.blurb}</small></span></button>`).join('');
  const s = D.style(st.style);
  $('#sizing').innerHTML = `<div class="block">${counter('pizzas', 'Pizzas', st.pizzas)}</div>
    <div class="block" style="display:grid;gap:16px">${s.shape === 'both' ? seg('Shape', 'shape', [['rect', 'Rectangular pan'], ['round', 'Round']], st.shape) : ''}
      ${st.shape === 'rect' ? `<div class="pair">${counter('w', LEN.w, D.fmtLen(st.w, st.units))}${counter('l', LEN.l, D.fmtLen(st.l, st.units))}</div>` : counter('d', LEN.d, D.fmtLen(st.d, st.units))}
      ${seg('Measure in', 'units', [['cm', 'Centimetres'], ['in', 'Inches']], st.units)}</div>
    <div class="block">${slider('tf')}</div>`;
  $('#tune').innerHTML = `<div class="block" style="margin-top:12px">${slider('hydration')}</div>
    <details id="d-fine"${keep['d-fine'] ? ' open' : ''}><summary><span>Fine-tune<small>Salt, yeast, oil, sugar</small></span></summary><div class="inside">
      ${slider('salt')}${slider('yeast')}${seg('Type of yeast', 'ytype', Object.entries(D.YEAST_NAMES).map(([k, v]) => [k, v.replace(' yeast', '')]), st.yeastType)}${slider('oil')}${slider('sugar')}${slider('malt')}${slider('enhancer')}</div></details>
    <details id="d-pref"${keep['d-pref'] ? ' open' : ''}><summary><span>Preferment<small id="prefsub"></small></span></summary><div class="inside">
      ${seg('Make part of the dough the day before', 'pref', Object.entries(D.PREF_NAMES), st.pref.type)}${st.pref.type === 'none' ? '' : slider('prefPct') + slider('prefHyd')}</div></details>`;
  paint();
}
/* paint(): numbers only. Safe to call while a slider is being dragged. */
function paint() {
  rec = D.calc(st);
  const s = D.style(st.style), n = st.pizzas, ing = (key, name, g, pct) => `<div class="ing"><span>${name}</span><span class="g num">${D.fmtG(g, key)}<small>${D.fmtOz(g)}</small></span>${pct === undefined ? '<span></span>' : `<span class="pc num">${pct}</span>`}</div>`;
  $('#recipe').innerHTML = `<div class="rhead"><img src="${s.img}" alt=""><div><b>${s.name}</b><span class="num">${n} × ${rec.ballWeight} g · ${D.sizeLabel(st)}</span></div></div>`
    + rec.ingredients.map((i) => ing(i.key, i.name, i.g, pc(i.pct))).join('')
    + `<div class="ing sum"><span>Total dough</span><span class="g num">${Math.round(rec.totalDough)} g<small>${D.fmtOz(rec.totalDough)}</small></span><span></span></div>`
    + (rec.stages ? `${rec.warnWater ? '<p class="warn">The preferment holds more water than the whole dough. Lower its share or its water.</p>' : ''}<p class="stagehd">Day before · ${rec.stages.name}</p>${rec.stages.first.map((x) => ing(x.key, x.name, x.g)).join('')}<p class="stagehd">Baking day · main dough</p>${rec.stages.main.map((x) => ing(x.key, x.name, x.g)).join('')}` : '')
    + `<button type="button" class="go" id="copywide" data-copy>Copy recipe</button>`;
  for (const k of Object.keys(F)) { const o = $('#o-' + k), y = $('#y-' + k); if (o) o.textContent = F[k].text(F[k].get()); if (y) y.textContent = F[k].say(); }
  for (const k of ['d', 'w', 'l']) { const c = $('#c-' + k); if (c) c.textContent = D.fmtLen(st[k], st.units); }
  if ($('#c-pizzas')) $('#c-pizzas').textContent = n;
  $('#prefsub').textContent = st.pref.type === 'none' ? 'Optional. More flavour.' : `${D.PREF_NAMES[st.pref.type]}, ${st.pref.pct}% of the flour`;
  const m = D.method(st, rec), b = D.bake(st);
  $('#howsub').textContent = m.length === 2 ? 'Two stages' : 'One stage';
  $('#how').innerHTML = m.map((x) => `<div><h3>${x.title}<span>${x.time}</span></h3><ol>${x.steps.map((t) => `<li>${t}</li>`).join('')}</ol></div>`).join('');
  $('#bakesub').textContent = `${b.temp.split(' / ')[0]} · ${b.time}`;
  $('#bake').innerHTML = `<div class="facts"><div><small>Oven</small><b class="num">${b.temp}</b></div><div><small>Time</small><b class="num">${b.time}</b></div></div><p><strong>Flour:</strong> ${b.flour}</p><ol>${b.steps.map((t) => `<li>${t}</li>`).join('')}</ol>`;
  $('#sum1').textContent = step === 3 ? `Flour ${D.fmtG(rec.flour)}` : `${s.name} · ${n} × ${rec.ballWeight} g`;
  $('#sum2').textContent = step === 3 ? `Water ${D.fmtG(rec.flour * st.hydration / 100)} · ${n} × ${rec.ballWeight} g` : `${Math.round(rec.totalDough)} g dough · ${D.sizeLabel(st)}`;
  $('#go').textContent = step === 1 ? 'Next: size' : step === 2 ? 'See recipe' : 'Copy recipe';
}
function go(n) {
  step = n; document.body.dataset.step = n; $('#back').hidden = n === 1;
  $$('.tab').forEach((t) => t.dataset.go == n ? t.setAttribute('aria-current', 'step') : t.removeAttribute('aria-current'));
  paint();
  if (!wide()) { scrollTo({ top: 0 }); $('#h' + n).focus({ preventScroll: true }); }
}
function setField(k, v) {
  const f = F[k], [min, max, s] = f.range();
  v = +Math.min(max, Math.max(min, Math.round(v / s) * s)).toFixed(2); f.set(v);
  const i = $('#r-' + k); if (i) i.style.setProperty('--p', (v - min) / (max - min) * 100 + '%');
  paint();
}
function copy(btn) {
  const label = btn.textContent, done = (ok) => { btn.textContent = ok ? 'Copied ✓' : 'Copy failed'; setTimeout(() => { btn.textContent = label; }, 1800); };
  Promise.resolve().then(() => navigator.clipboard.writeText(D.copyText(st, rec))).then(() => done(true), () => done(false));
}
document.addEventListener('input', (e) => { if (e.target.dataset.k) setField(e.target.dataset.k, +e.target.value); });
document.addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return; const d = t.dataset;
  if (d.go) return go(+d.go);
  if (t.id === 'back') return go(step - 1);
  if (t.id === 'go') return step === 3 ? copy(t) : go(step + 1);
  if ('copy' in d) return copy(t);
  if (d.style) { st = D.setStyle(st, d.style); build(); if (!wide()) go(2); return; }
  if (d.shape) { st = { ...st, shape: d.shape }; return build(); }
  if (d.units) { st = { ...st, units: d.units }; return build(); }
  if (d.ytype) { st = D.setYeastType(st, d.ytype); return build(); }
  if (d.pref) { st = D.setPreferment(st, d.pref); return build(); }
  if (d.nudge) {
    const k = d.nudge, dir = +d.dir, [min, max] = D.RANGES[k];
    st = { ...st, [k]: k === 'pizzas' ? Math.min(max, Math.max(min, st.pizzas + dir)) : Math.min(max, Math.max(min, D.fromDisp(Math.round(D.toDisp(st[k], st.units)) + dir, st.units))) };
    paint();
  }
});
build();
</script>
