<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Color scheme meta tag - informs browser plugins like Dark Reader that we have native dark mode -->
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Make Better Pizza" />
    <meta name="theme-color" content="#1C5A3A" />
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TQWFS0SBSD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-TQWFS0SBSD');
    </script>
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS home screen icon (iOS rounds the corners itself) -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Make Better Pizza</title>
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Make Better Pizza" />
    <meta property="og:description" content="Calculate the perfect pizza dough recipe for any style and size. Customize hydration, salt, and more for your ideal pizza." />
    <meta property="og:image" content="https://makebetter.pizza/share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Make Better Pizza: dough recipes by weight for six pizza styles, beside a Neapolitan margherita" />

    <meta property="og:url" content="https://makebetter.pizza" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Make Better Pizza" />
    
    <!-- Twitter Card data -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Make Better Pizza" />
    <meta name="twitter:description" content="Calculate the perfect pizza dough recipe for any style and size. Customize hydration, salt, and more for your ideal pizza." />
    <meta name="twitter:image" content="https://makebetter.pizza/share.jpg" />
    
    <!-- General Meta Tags -->
    <meta name="description" content="Calculate the perfect pizza dough recipe for any style and size. Customize hydration, salt, and more for your ideal pizza." />
    <meta name="keywords" content="pizza, dough, calculator, recipe, baking, cooking, hydration, baker's percentages" />
    
    <!-- Schema.org markup for better Telegram compatibility -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Make Better Pizza",
      "description": "Calculate the perfect pizza dough recipe for any style and size. Customize hydration, salt, and more for your ideal pizza.",
      "image": "https://makebetter.pizza/share.jpg",
      "url": "https://makebetter.pizza",
      "applicationCategory": "UtilityApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
    
    <script>
      // Set the theme before the first paint, so a dark-theme visitor never sees a light flash.
      // ThemeContext reads the same key and takes over from here.
      (function () {
        var theme;
        try { theme = localStorage.getItem('theme'); } catch (e) { /* no saved choice */ }
        if (theme !== 'light' && theme !== 'dark') theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
